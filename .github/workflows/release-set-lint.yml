name: Release Set Source Checks

# PR-safe tests, with no private CI runner or deploy credentials.
on:
  pull_request:
    paths:
      - "scripts/verify_release_set.py"
      - "ci/release_admission.py"
      - "tests/test_release_admission.py"
      - ".github/workflows/production-release-preflight.yml"
      - ".github/workflows/production-ssh-smoke.yml"
      - "CI_CD.md"
      - "scripts/release_manifest.py"
      - "tests/test_verify_release_set.py"
      - "tests/test_release_manifest.py"
      - ".github/workflows/release-set.yml"
      - ".github/workflows/release-set-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-set-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit-test per-platform and cross-platform manifests
        run: |
          python3 tests/test_release_manifest.py
          python3 tests/test_verify_release_set.py
          python3 tests/test_release_admission.py
