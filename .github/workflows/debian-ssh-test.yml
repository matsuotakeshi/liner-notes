
name: Debian SSH Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Debian Remote Test
    if: ${{ github.repository == 'matsuotakeshi/liner-notes' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Check Debian
        run: |
          ssh \
            -i /home/ci/.ssh/id_ed25519_debian_ci \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ci-test@10.0.0.59 \
            'set -e; . /etc/os-release; test "$ID" = debian; hostname; uname -a; cat /etc/os-release; id'

      - name: Test result
        run: echo "Debian SSH - OK"
