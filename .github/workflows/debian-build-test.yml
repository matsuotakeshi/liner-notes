name: Debian Build and Test

# Manual/reusable entry point shares the same worker and host exclusion.
on:
  workflow_dispatch:
    inputs:
      telnet_start_timeout_seconds:
        description: Seconds to wait for the first Telnet prompt (10-120)
        type: number
        default: 10
  workflow_call:
permissions:
  contents: read
concurrency:
  group: liner-notes-native-hosts
  cancel-in-progress: false
jobs:
  test:
    name: Debian Native Tests
    if: ${{ github.repository == 'matsuotakeshi/liner-notes' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native suites through existing CI SSH accounts
        env:
          TELNET_START_TIMEOUT: ${{ inputs.telnet_start_timeout_seconds }}
        run: |
          set -eu
          set -- --target debian --output "$RUNNER_TEMP/native-results"
          if [ -n "$TELNET_START_TIMEOUT" ]; then
            set -- "$@" --telnet-start-timeout "$TELNET_START_TIMEOUT"
          fi
          python3 ci/native_ci.py "$@"
      - name: Retain OS logs and exact-commit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-debian-results
          path: |
            ${{ runner.temp }}/native-results/*.log
            ${{ runner.temp }}/native-results/results.json
          if-no-files-found: warn
          retention-days: 30
