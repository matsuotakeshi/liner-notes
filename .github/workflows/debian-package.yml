name: Debian 13 Package CI

# Builds an untrusted PR on GitHub-hosted infrastructure only; no SSH or deploy secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml
  build-deb:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate the canonical offline manual
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/manual-venv"
          "$RUNNER_TEMP/manual-venv/bin/pip" install -r scripts/manual/requirements.txt
          "$RUNNER_TEMP/manual-venv/bin/python" scripts/manual/build.py docs/book
          "$RUNNER_TEMP/manual-venv/bin/python" scripts/manual/check.py docs/book
      - name: Build and test in isolated Debian 13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deb-artifacts"
          docker run --rm \
            -e "SOURCE_SHA=$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/deb-artifacts:/out" \
            debian:trixie bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq build-essential debhelper clang \
                libssl-dev libsqlite3-dev python3 ca-certificates
              mkdir -p /build/liner-notes
              cp -a /source/. /build/liner-notes/
              cd /build/liner-notes
              dpkg-buildpackage -b -us -uc
              cp /build/liner-notes_[0-9]*_amd64.deb /build/liner-notes-web_*.deb \
                /build/liner-notes-link_*.deb /out/
              test "$(find /out -maxdepth 1 -type f -name "*.deb" | wc -l)" -eq 3
              for package in /out/*.deb; do
                dpkg-deb --info "$package"
                dpkg-deb --contents "$package" >/dev/null
              done
              apt-get install -y /out/liner-notes_*.deb \
                /out/liner-notes-web_*.deb /out/liner-notes-link_*.deb
              test -x /usr/sbin/liner-notes
              test -x /usr/sbin/liner-notes-web
              test -x /usr/bin/liner-notes-link
              test -f /etc/liner-notes/liner-notes.env
              test -f /etc/liner-notes/link.toml
              test -f /etc/liner-notes/web/web.toml
              # Separate same-source package-revision upgrade rehearsal in this
              # throwaway container (no production data or services).
              CI_DISPOSABLE_DEBIAN=1 bash /build/liner-notes/ci/test-debian-package-upgrade.sh
              apt-get remove -y liner-notes-link liner-notes-web liner-notes
              test "$(cat /var/lib/liner-notes/package-removal-test)" = keep
              cd /out
              sha256sum ./*.deb > SHA256SUMS
              sha256sum -c SHA256SUMS
              python3 /build/liner-notes/scripts/release_manifest.py create \
                --platform debian13 --version 0.74.1-1 --source-sha "$SOURCE_SHA" \
                --directory /out \
                --package liner-notes=liner-notes_0.74.1-1_amd64.deb \
                --package liner-notes-web=liner-notes-web_0.74.1-1_all.deb \
                --package liner-notes-link=liner-notes-link_0.74.1-1_all.deb
              python3 /build/liner-notes/scripts/release_manifest.py verify \
                --platform debian13 --source-sha "$SOURCE_SHA" \
                --manifest /out/RELEASE-MANIFEST.json
              printf "source_sha=%s\nbase=debian:trixie\n" "$SOURCE_SHA" > BUILD-INFO.txt
            '
      - name: Upload inspection artifacts (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: liner-notes-debian13-packages
          path: |
            ${{ runner.temp }}/deb-artifacts/*.deb
            ${{ runner.temp }}/deb-artifacts/SHA256SUMS
            ${{ runner.temp }}/deb-artifacts/RELEASE-MANIFEST.json
            ${{ runner.temp }}/deb-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
