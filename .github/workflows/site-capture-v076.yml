name: Capture isolated v0.76 site screens
on:
  push:
    branches: ['ci/site-capture-v076-20261128']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact runtime source
        run: |
          test "$(git rev-parse HEAD^)" = 66b157e7b76a9e0be23fd870de63adc5afbddc58
          test "$(git diff --name-only HEAD^ HEAD | grep -vc '^.github/' || true)" = 0
      - name: Install isolated capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libsqlite3-dev libssl-dev fonts-noto-cjk python3-venv
          python3 -m venv "$RUNNER_TEMP/site-capture-venv"
          "$RUNNER_TEMP/site-capture-venv/bin/pip" install 'pyte==0.8.2' 'Pillow==11.3.0'
      - name: Build release runtime
        run: make -j2 runtime CC=clang SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3
      - name: Capture real Telnet sessions
        run: |
          "$RUNNER_TEMP/site-capture-venv/bin/python" .github/scripts/site-capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liner-v076-isolated-terminal-captures
          path: capture-output/
          if-no-files-found: error
          retention-days: 7
