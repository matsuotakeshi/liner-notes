name: FreeBSD Build and Test

# Manual/reusable entry point shares the same worker and host exclusion.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: liner-notes-native-hosts
  cancel-in-progress: false
jobs:
  test:
    name: FreeBSD Native Tests
    if: ${{ github.repository == 'matsuotakeshi/liner-notes' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native suites through existing CI SSH accounts
        run: python3 ci/native_ci.py --target freebsd --output "$RUNNER_TEMP/native-results"
      - name: Retain OS logs and exact-commit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-freebsd-results
          path: |
            ${{ runner.temp }}/native-results/*.log
            ${{ runner.temp }}/native-results/results.json
          if-no-files-found: warn
          retention-days: 30
