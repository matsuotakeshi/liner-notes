name: Release Set Verification

# Audit candidates after the trusted FreeBSD main-push package job succeeds.
# Never connect to production hosts or enable deployment credentials.
on:
  workflow_run:
    workflows: ["FreeBSD 15 Package CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character main HEAD commit SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: liner-notes-release-candidate-audit
  cancel-in-progress: false

jobs:
  changes:
    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Read the triggering package workflow's scope receipt
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-change-scope
          path: scope
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Require explicit build or documented non-applicability
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          build = True
          if os.environ['EVENT'] == 'workflow_run':
              receipt = json.loads(Path('scope/ci-change-scope.json').read_text())
              assert receipt['schema'] == 1 and receipt['event'] == 'push'
              assert receipt['source_sha'] == os.environ['SOURCE_SHA']
              assert type(receipt['build']) is bool
              build = receipt['build']
              if not build:
                  assert receipt['reason'] == 'documentation-only' and receipt['files']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build=' + str(build).lower() + '\n')
          if not build:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Documentation-only: no package artifacts produced; release-set verification is not applicable.\n')
          PY
  verify:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact-main candidate packages and verify their provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full lowercase SHA is required"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$SOURCE_SHA" || "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Only the exact current main HEAD can be audited"
            exit 1
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$SOURCE_SHA" ]]; then
            echo "::error::Main has moved since this verification was started"
            exit 1
          fi
          mkdir -p candidates
          fetch_platform() {
            local platform="$1" workflow="$2" artifact="$3"
            local record run_id result attempt
            # A successful FreeBSD main-push package job triggers this check.
            # The other independent package jobs may still be finishing.
            # Poll with a bounded timeout; fail closed.
            for attempt in {1..60}; do
              record="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&per_page=100" |
                jq -r --arg sha "$SOURCE_SHA" '
                  [.workflow_runs[] | select(
                    .head_sha == $sha and .head_branch == "main" and
                    (.event == "push" or .event == "workflow_dispatch")
                  )] | sort_by(.run_number, .run_attempt) | last |
                  if . == null then "none pending"
                  else "\(.id) \(.conclusion // .status)" end
                ')"
              read -r run_id result <<< "$record"
              case "$result" in
                success) break ;;
                failure|cancelled|timed_out|action_required|skipped)
                  echo "::error::$platform CI run $run_id ended with $result"
                  return 1 ;;
                queued|pending|waiting|in_progress)
                  echo "$platform CI run $run_id is $result (poll $attempt/60)" ;;
                *)
                  echo "$platform CI run not available yet (poll $attempt/60)" ;;
              esac
              sleep 10
            done
            if [[ ! "$run_id" =~ ^[0-9]+$ || "$result" != success ]]; then
              echo "::error::No successful main CI for $platform at $SOURCE_SHA"
              return 1
            fi
            mkdir -p "candidates/$platform"
            gh run download "$run_id" --name "$artifact" --dir "candidates/$platform"
            echo "$platform source=$SOURCE_SHA run=$run_id"
            printf '%s %s https://github.com/%s/actions/runs/%s\n' \
              "$platform" "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$run_id" >> RELEASE-SOURCES.txt
          }
          fetch_platform "freebsd15" "freebsd-package.yml" "liner-notes-freebsd15-packages"
          fetch_platform "rocky10" "rocky-package.yml" "liner-notes-rocky10-packages"
          fetch_platform "debian13" "debian-package.yml" "liner-notes-debian13-packages"
          # A moving main must never be accepted as the current release set.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          python3 scripts/verify_release_set.py --root candidates \
            --source-sha "$SOURCE_SHA" --output RELEASE-SET.json
      - name: Save verified release-set receipt (no packages are deployed)
        uses: actions/upload-artifact@v4
        with:
          name: liner-notes-release-set-receipt
          path: |
            RELEASE-SET.json
            RELEASE-SOURCES.txt
          if-no-files-found: error
          retention-days: 30
