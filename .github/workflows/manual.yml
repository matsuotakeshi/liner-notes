name: Canonical manual
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/manual/requirements.txt
      - run: python scripts/manual/build.py build/manual --zip
      - run: python scripts/manual/check.py build/manual --report build/manual-validation.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/manual/test-search.cjs build/manual
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-manual
          path: |
            build/liner-notes-*-manual-*.zip
            build/manual-validation.json
