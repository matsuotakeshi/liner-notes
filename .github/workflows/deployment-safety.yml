name: Deployment safety
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml
  isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install cryptography
      - name: Test closed deployment policy and isolated three-node transactions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/deployment-evidence
          python3 -c 'import json,os; from pathlib import Path; Path("build/deployment-evidence/source.json").write_text(json.dumps({"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"]})+"\n")'
          for suite in deployment deploy_components deploy_restore_readonly freebsd_upgrade_boundary freebsd_package_lease; do
            python3 "tests/test_${suite}.py" 2>&1 | tee "build/deployment-evidence/${suite}.log"
          done
          python3 -m py_compile ci/freebsd_upgrade_root.py ci/freebsd_upgrade_jail.py ci/prepare_freebsd_upgrade_template.py ci/install_freebsd_upgrade_helper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-safety-evidence
          path: build/deployment-evidence/
          retention-days: 90
  restored-runtime:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libssl-dev libsqlite3-dev python3-cryptography
      - run: make -j2 CC=clang SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3
      - name: Restore and boot the actual BBS using a disposable unprivileged account
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 755 /usr/local/libexec/liner-notes-deploy-ci
          sudo install -m 755 runtime /usr/local/libexec/liner-notes-deploy-ci/runtime
          sudo env GITHUB_ACTIONS=true /usr/bin/python3 tests/test_deploy_restore_runtime.py 2>&1 | tee build/deployment-runtime-restore.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-runtime-restore
          path: build/deployment-runtime-restore.log
          retention-days: 90
