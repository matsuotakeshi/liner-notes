name: Native CI Source Checks

# Safe synthetic tests only: never connects to the private network.
on:
  pull_request:
    paths:
      - "ci/native_*.py"
      - "ci/freebsd_package_lease.py"
      - "tests/test_freebsd_package_lease.py"
      - ".github/workflows/freebsd-package.yml"
      - "ci/solaris_ci.py"
      - "ci/*solaris_smf*.py"
      - "tests/test_solaris_smf_ci.py"
      - "ci/solaris_door_jail.py"
      - "tests/test_solaris_door_jail.py"
      - "tests/solaris_door_jail_probe.c"
      - "tests/solaris_door_auth_transport_probe.c"
      - "ci/solaris_door_boundary.py"
      - "tests/test_solaris_door_boundary.py"
      - "tests/solaris_door_identity_probe.c"
      - "solaris/**"
      - "scripts/*solaris*.py"
      - "tests/test_solaris_service.py"
      - "src/door_lock.*"
      - "src/door_lock_helper.c"
      - "tests/test_doors_generic.py"
      - "tests/test_door_lock.*"
      - "scripts/posix_locks.py"
      - "tests/test_posix_locks.py"
      - "ports/test-resume.py"
      - "tests/test_resume_receipt.py"
      - "tests/test_transfer_terminal.py"
      - "tests/transfer_terminal_fixture.py"
      - "tests/test_zmodem.py"
      - "tests/test_solaris_port.py"
      - ".github/workflows/solaris-ssh-test.yml"
      - "ci/native-test-requirements.txt"
      - "tests/test_native_ci.py"
      - "tests/test_native_ssh.py"
      - ".github/workflows/embedded-ssh-native.yml"
      - "tests/test_native_lock_wait.py"
      - ".github/workflows/*build-test.yml"
      - ".github/workflows/multi-os-ci.yml"
      - ".github/workflows/native-ci-lint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ci/native-test-requirements.txt
      - run: python tests/test_native_ci.py
      - run: python tests/test_native_ssh.py
      - run: python tests/test_native_lock_wait.py
      - run: python tests/test_freebsd_package_lease.py
      - run: python tests/test_solaris_port.py
      - run: python tests/test_solaris_service.py
      - run: python tests/test_solaris_smf_ci.py
      - run: python tests/test_solaris_door_boundary.py
      - run: python tests/test_solaris_door_jail.py
      - run: python tests/test_door_lock.py
      - run: python tests/test_posix_locks.py
      - run: python tests/test_resume_receipt.py
      - run: python tests/test_transfer_terminal.py
      - name: Preserve strict GCC diagnostics and exercise Door integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libsqlite3-dev
          make -j2 CC=gcc PYTHON=python3 SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3 all
          make CC=gcc PYTHON=python3 SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3 test-doors
      - name: Exercise Solaris record leases in the full hosted runtime
        run: |
          make -B CC=gcc PYTHON=python3 SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3 CPPFLAGS=-DLINER_TEST_POSIX_DOOR_LOCK=1 runtime
          python3 tests/test_doors_generic.py ./runtime
