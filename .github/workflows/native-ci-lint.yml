name: Native CI Source Checks

# Safe synthetic tests only: never connects to the private network.
on:
  pull_request:
    paths:
      - "ci/native_*.py"
      - "ci/solaris_ci.py"
      - "solaris/**"
      - "scripts/*solaris*.py"
      - "tests/test_solaris_service.py"
      - "src/door_lock.*"
      - "tests/test_door_lock.*"
      - "scripts/posix_locks.py"
      - "tests/test_posix_locks.py"
      - "tests/test_solaris_port.py"
      - ".github/workflows/solaris-ssh-test.yml"
      - "ci/native-test-requirements.txt"
      - "tests/test_native_ci.py"
      - "tests/test_native_lock_wait.py"
      - ".github/workflows/*build-test.yml"
      - ".github/workflows/multi-os-ci.yml"
      - ".github/workflows/native-ci-lint.yml"
  push:
    branches: [main]
    paths:
      - "ci/native_*.py"
      - "ci/solaris_ci.py"
      - "solaris/**"
      - "scripts/*solaris*.py"
      - "tests/test_solaris_service.py"
      - "src/door_lock.*"
      - "tests/test_door_lock.*"
      - "scripts/posix_locks.py"
      - "tests/test_posix_locks.py"
      - "tests/test_solaris_port.py"
      - ".github/workflows/solaris-ssh-test.yml"
      - "ci/native-test-requirements.txt"
      - "tests/test_native_ci.py"
      - "tests/test_native_lock_wait.py"
      - ".github/workflows/*build-test.yml"
      - ".github/workflows/multi-os-ci.yml"
      - ".github/workflows/native-ci-lint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ci/native-test-requirements.txt
      - run: python tests/test_native_ci.py
      - run: python tests/test_native_lock_wait.py
      - run: python tests/test_solaris_port.py
      - run: python tests/test_solaris_service.py
      - run: python tests/test_door_lock.py
      - run: python tests/test_posix_locks.py
      - name: Preserve strict GCC diagnostics and exercise Door integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libsqlite3-dev
          make -j2 CC=gcc PYTHON=python3 SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3 all
          make CC=gcc PYTHON=python3 SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3 test-doors
