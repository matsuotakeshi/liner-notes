name: Rocky SELinux policy
on:
  pull_request:
    paths:
      - 'linux/selinux/**'
      - 'ci/selinux*'
      - 'tests/test_selinux*'
      - '.github/workflows/selinux.yml'
  push:
    branches: [main]
    paths:
      - 'linux/selinux/**'
      - 'ci/selinux*'
      - 'tests/test_selinux*'
      - '.github/workflows/selinux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fresh-instance bootstrap against the real runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev libsqlite3-dev python3-venv
          python3 -m venv build/selinux-bootstrap-venv
          build/selinux-bootstrap-venv/bin/pip install -r link-requirements.txt
          make -j2 runtime CC=clang SQLITE_CFLAGS= SQLITE_LIBS=-lsqlite3
          build/selinux-bootstrap-venv/bin/python -B tests/test_selinux_bootstrap.py ./runtime
      - name: Compile the policy and its optional RPM in Rocky 10
        run: |
          python3 tests/test_selinux_policy.py
          python3 tests/test_selinux_root.py
          python3 -m py_compile ci/selinux_native.py ci/selinux_root.py
          mkdir -p build/selinux
          docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" -v "$GITHUB_WORKSPACE/build/selinux:/out" \
            rockylinux/rockylinux:10 bash -euc '
              dnf install -y --setopt=install_weak_deps=False selinux-policy-devel rpm-build make python3 procps-ng setools-console
              mkdir -p /build/{SOURCES,SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
              cp /source/linux/selinux/liner_notes.te /source/linux/selinux/liner_notes.fc /source/linux/selinux/selinux_labels.py /build/SOURCES/
              cp /source/LICENSE /build/SOURCES/
              rpmbuild -ba --define "_topdir /build" /source/linux/selinux/liner-notes-selinux.spec
              cp /build/RPMS/noarch/*.rpm /out/
              rpmbuild -ba --define "_topdir /build" --define "policy_release 2" /source/linux/selinux/liner-notes-selinux.spec
              CI_SELINUX_DISPOSABLE=1 bash /source/ci/selinux-package-lifecycle.sh /build/RPMS/noarch/*-1.*.rpm /build/RPMS/noarch/*-2.*.rpm
              cd /out
              sha256sum *.rpm > SHA256SUMS
            '
          printf 'source_sha=%s\n' "$GITHUB_SHA" > build/selinux/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: liner-notes-selinux-policy
          path: build/selinux/
          if-no-files-found: error
  native:
    needs: policy
    if: ${{ github.repository == 'matsuotakeshi/liner-notes' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the installed root-owned acceptance helper and run exact main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/selinux-inventory"
          expected=$(sha256sum ci/selinux_root.py | cut -d' ' -f1)
          actual=$(ssh -i /home/ci/.ssh/id_ed25519_rocky_ci \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 ci-test@10.0.0.51 \
            'sha256sum /usr/local/libexec/liner-notes-ci-selinux' | cut -d' ' -f1)
          test "$actual" = "$expected"
          ssh -i /home/ci/.ssh/id_ed25519_rocky_ci \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 ci-test@10.0.0.51 \
            "sudo -n /usr/local/libexec/liner-notes-ci-selinux $SOURCE_SHA" \
            > "$RUNNER_TEMP/selinux-inventory/rocky.txt" 2>&1
      - name: Write exact-SHA Enforcing acceptance receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'selinux-inventory'
          result = json.loads((directory / 'rocky.txt').read_text().splitlines()[-1])
          assert result['source_sha'] == os.environ['SOURCE_SHA']
          assert result['enforcing'] is True and result['acceptance'] == 'success'
          for key in ('archive_sha256', 'policy_sha256', 'runtime_sha256'):
              assert re.fullmatch(r'[0-9a-f]{64}', result[key])
          (directory / 'SELINUX-ACCEPTANCE.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selinux-native-acceptance
          path: ${{ runner.temp }}/selinux-inventory/
