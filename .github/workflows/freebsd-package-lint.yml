name: FreeBSD Package Source Checks

# PR checks run on a GitHub-hosted runner without private LAN access.
on:
  pull_request:
    paths:
      - "ci/build-freebsd-package.sh"
      - "ci/test-freebsd-package-upgrade.py"
      - "ci/freebsd_fixture_libraries.py"
      - "tests/test_freebsd_package_libraries.py"
      - "scripts/release_manifest.py"
      - "tests/test_release_manifest.py"
      - ".github/workflows/freebsd-package.yml"
      - ".github/workflows/freebsd-package-lint.yml"
      - "ports/comms/liner-notes/**"
      - "*.md"
      - "scripts/*.py"
      - "tests/test_freebsd_plist.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate packaging script and artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          sh -n ci/build-freebsd-package.sh
          python3 tests/test_release_manifest.py
          python3 tests/test_freebsd_package_libraries.py
          python3 tests/test_freebsd_fixture_config.py
          python3 -m venv "$RUNNER_TEMP/manual-venv"
          "$RUNNER_TEMP/manual-venv/bin/pip" install -r scripts/manual/requirements.txt
          "$RUNNER_TEMP/manual-venv/bin/python" tests/test_freebsd_plist.py
          git archive --format=tar HEAD | tar -tf - |
            grep -Fx ports/comms/liner-notes/Makefile > /dev/null
          echo "PASS: PR-safe FreeBSD packaging checks."
