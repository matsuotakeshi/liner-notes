
name: Ubuntu SSH Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu Remote Test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Check Ubuntu
        run: |
          ssh \
            -i /home/ci/.ssh/id_ed25519_ubuntu_ci \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ci-test@10.0.0.53 \
            'hostname; uname -a; cat /etc/os-release; id'

      - name: Test result
        run: echo "Ubuntu SSH - OK"
