
name: Rocky Linux SSH Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rocky Linux Remote Test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Verify CI user
        run: |
          whoami
          hostname

      - name: Check Rocky Linux
        run: |
          ssh \
            -i /home/ci/.ssh/id_ed25519_rocky_ci \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ci-test@10.0.0.51 \
            'uname -a; cat /etc/os-release; id'

      - name: Test result
        run: |
          echo "Rocky Linux SSH: OK"
