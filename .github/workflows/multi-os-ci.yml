name: Multi-OS Native CI

# One existing runner coordinates three remote suites concurrently.
# Never dispatch private-LAN code from a PR or a non-main ref.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liner-notes-native-hosts
  cancel-in-progress: false
jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml
  native:
    needs: changes
    name: Parallel FreeBSD / Rocky / Ubuntu regression
    if: ${{ github.repository == 'matsuotakeshi/liner-notes' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native suites through existing CI SSH accounts
        run: python3 ci/native_ci.py --target all --output "$RUNNER_TEMP/native-results"
      - name: Retain OS logs and exact-commit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-results
          path: |
            ${{ runner.temp }}/native-results/*.log
            ${{ runner.temp }}/native-results/results.json
          if-no-files-found: warn
          retention-days: 30

  release-gate:
    name: All required native suites passed
    if: ${{ always() }}
    needs: [changes, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, skipped or cancelled native suites
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [ "$BUILD" = false ]; then
            test "$NATIVE_RESULT" = skipped
            echo "Documentation-only: native tests are not applicable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$BUILD" = true
          test "$NATIVE_RESULT" = success
          echo "PASS: All 3 native OS suites passed on this exact commit."
