name: Linux compatibility
on:
  push:
    branches: [main, linux-support, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [rockylinux/rockylinux:9, almalinux:9]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in the target distribution
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/source:ro" "$IMAGE" bash /source/ci/linux.sh
