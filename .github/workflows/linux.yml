name: Linux compatibility
on:
  push:
    branches: [main, linux-support, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml
  linux:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [rockylinux/rockylinux:9, almalinux:9]
    steps:
      - name: Require a successful scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$BUILD" in true|false) ;; *) exit 1 ;; esac
          if [ "$BUILD" = false ]; then
            echo "Documentation-only: build and runtime tests are not applicable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.build == 'true' }}
      - name: Restore pinned lrzsz source
        if: ${{ needs.changes.outputs.build == 'true' }}
        uses: actions/cache@v4
        with:
          path: build/lrzsz-source
          key: lrzsz-source-0.13.1-112f91059fbd118e016d800c1a5c5a1702e965d8b9bfbda6015e44e20bfb93c9
      - name: Verify or fetch pinned lrzsz source
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: |
          python3 tests/test_lrzsz_download.py
          python3 scripts/build-lrzsz.py --download-archive build/lrzsz-source/lrzsz-0.13.1.tar.gz
      - name: Build and test in the target distribution
        if: ${{ needs.changes.outputs.build == 'true' }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/source:ro" "$IMAGE" bash /source/ci/linux.sh
