# Inside the existing TLS VirtualHost. Apache 2.4.47+ with mod_proxy and
# mod_proxy_http. Do not replace the site's existing TLS configuration.
# web.toml: origin=https://srv.ysni.org, base_path=/notes/
ProxyRequests Off
ProxyPreserveHost On
RedirectMatch 308 ^/notes$ /notes/
ProxyPass        /notes/ http://127.0.0.1:8088/notes/ upgrade=websocket timeout=600
ProxyPassReverse /notes/ http://127.0.0.1:8088/notes/
<Location /notes/>
    # Same per-file maximum as the Web connector. Lower it together with config.
    LimitRequestBody 1073741824
</Location>
# Keep the HTTP gateway loopback-only. Do not publish port 8088 directly.
# Do not log Cookie, X-CSRF-Token, Sec-WebSocket-Protocol, or request bodies.
